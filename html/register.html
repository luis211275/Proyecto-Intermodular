<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    
    <header id="register-header">
        <h1>Registro de usuario</h1>
    </header>

    <main id="register-main">

        <label>Nombre: <input type="text" id="nameRegister" placeholder="Nombre del usuario"></label><br>

        <label>Apellido: <input type="text" id="apellidoRegister" placeholder="Apellido del usuario"></label><br>
        
        <label>Email: <input type="text" id="emailRegister" placeholder="Email del usuario"></label><br>
        
        <label>DNI: <input type="text" id="dniRegister" placeholder="DNI del usuario"></label><br>
        
        <label>Telefono: <input type="number" id="telefonoRegister" placeholder="Teléfono del usuario"></label><br>

        <label>Contraseña: <input type="password" id="passwordRegister" placeholder="Contraseña del usuario"></label><br>

        <button id="btnRegister">Registrar Usuario</button>
    </main>

</body>
</html>
