<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSCars - Publicar Coche</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/publicar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
</head>
<body class="publicar-page">
    <div class="grid-layout">
        <header>
            <h1>BSCars</h1>
            <h3 id="ventaCoche">Vende tu Coche</h3>
            <h3 id="login">Iniciar Sesión</h3>
        </header>

        <main class="main-content" id="app">
            <section class="publicar-shell">
                <div class="contenedor-formulario">
                    <a href="home.html" class="boton-volver">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                        Volver al catálogo
                    </a>
                    <form id="formVenta" class="cuadricula-formulario">
                        <div class="grupo-formulario">
                            <label for="marcaId">Marca</label>
                            <select id="marcaId" name="marcaId" required></select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="modeloId">Modelo</label>
                            <select id="modeloId" name="modeloId" required>
                                <option value="">Seleccione marca primero</option>
                            </select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="id_version">Versión</label>
                            <select id="id_version" name="id_version" required>
                                <option value="">Seleccione modelo primero</option>
                            </select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="anio">Año</label>
                            <input type="number" id="anio" name="anio" placeholder="2010" required min="1900">
                        </div>
                        <div class="grupo-formulario">
                            <label for="km">Kilometraje</label>
                            <input type="number" id="km" name="km" placeholder="10000" required>
                        </div>
                        <div class="grupo-formulario">
                            <label for="precio">Precio</label>
                            <input type="number" id="precio" name="precio" placeholder="50000" required>
                        </div>
                        <div class="grupo-formulario">
                            <label for="id_ciudad">Ciudad</label>
                            <select id="id_ciudad" name="id_ciudad" required></select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="id_combustible">Combustible</label>
                            <select id="id_combustible" name="id_combustible" required></select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="id_transmision">Transmisión</label>
                            <select id="id_transmision" name="id_transmision" required></select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="id_categoria">Categoría</label>
                            <select id="id_categoria" name="id_categoria" required></select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="id_color">Color</label>
                            <select id="id_color" name="id_color" required></select>
                        </div>
                        <div class="grupo-formulario">
                            <label for="id_etiqueta">Etiqueta Ambiental</label>
                            <select id="id_etiqueta" name="id_etiqueta" required></select>
                        </div>
                        <div class="grupo-formulario ancho-completo grupo-imagen">
                            <label for="imagen">Subir imagen</label>
                            <input type="file" id="imagen" name="imagen" accept="image/*" required>
                            <p class="ayuda-formulario">Obligatorio: sube una imagen del vehículo para crear el anuncio.</p>
                        </div>
                        <button type="submit" class="boton-enviar">Publicar coche</button>
                    </form>
                </div>
            </section>
            <script src="../js/publicar.js" type="module"></script>
        </main>

        <footer>© 2026 BSCars · Proyecto Intermodular. Todos los derechos reservados.</footer>
    </div>
</body>
</html>
