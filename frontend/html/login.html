<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio de sesion</title>
        <link rel="stylesheet" href="../css/login.css">
    </head>
    <body>
        
    <div class="grid-layout">
        <header>
            <h1>Nombre</h1>
            <h3 id="ventaCoche">Vende tu Coche</h3>
            <h3 id="login">Iniciar Sesión</h3>
        </header>

        <main class="main-content" id="login-main">
            <form id="form-login">
                <h2>Inicio de sesión</h2>
                <div id="data-login">
                    <label>Email: <input type="email" id="email-login" placeholder="Email del usuario"></label><br>
                    <label>Contraseña: <input type="password" id="password-login" placeholder="Contraseña del usuario"></label><br>

                    <p id="mensajeError"></p>

                    <button id="btnLogin">Iniciar Sesión</button>
                    
                    <p class="texto-registro">
                        ¿Todavía no tienes una cuenta?
                        <a href="register.html">Regístrate</a>
                    </p>
                </div>
            </form>

            <script src="../js/login.js"></script>
        </main>

        <footer>© 2026 Proyecto Intermodular. Todos los derechos reservados.</footer>
    </div>

    </body>
</html>
